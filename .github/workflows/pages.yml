name: pages-allowlist-deploy

# INC-PAGES-DEPLOY-OPTIMIZATION（2026-11-06 使用者核准）
# 目的：Pages 只部署「網站真的會用到」的檔案；本機與 CI 共用 scripts/build_pages_site.py
# 注意：需在 Settings → Pages → Source 選「GitHub Actions」後才會由本 workflow 接管。
#       未切換前，Pages 仍由 clean-main 分支直出（屆時分支已瘦身，一樣可用）。

on:
  push:
    branches: [clean-main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble site (fail-loud)
        run: python scripts/build_pages_site.py --out _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
